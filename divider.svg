<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="14" viewBox="0 0 1000 14" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="reflect">
<stop offset="0" stop-color="#7c3aed"/><stop offset="0.5" stop-color="#38bdf8"/><stop offset="1" stop-color="#F7C948"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-500 0" to="500 0" dur="5s" repeatCount="indefinite"/>
</linearGradient>
<filter id="b" x="-50%" y="-300%" width="200%" height="700%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect x="0" y="5" width="1000" height="4" rx="2" fill="url(#g)" opacity=".9"/>
<circle cy="7" r="5" fill="#fff" filter="url(#b)"><animate attributeName="cx" from="0" to="1000" dur="4s" repeatCount="indefinite"/></circle>
<circle cy="7" r="2.2" fill="#fff"><animate attributeName="cx" from="0" to="1000" dur="4s" repeatCount="indefinite"/></circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>