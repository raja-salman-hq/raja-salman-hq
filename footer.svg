<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="Thanks for visiting" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="0.55" stop-color="#1b1146"/><stop offset="1" stop-color="#062f35"/></linearGradient>
<linearGradient id="t" gradientUnits="userSpaceOnUse" x1="250" y1="0" x2="750" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#a78bfa"/><stop offset="0.5" stop-color="#38bdf8"/><stop offset="1" stop-color="#F7C948"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-500 0" to="500 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="w1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c3aed" stop-opacity=".6"/><stop offset="1" stop-color="#7c3aed" stop-opacity=".05"/></linearGradient>
<linearGradient id="w2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14b8a6" stop-opacity=".6"/><stop offset="1" stop-color="#14b8a6" stop-opacity=".05"/></linearGradient>
</defs>
<style>
.sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:'Fira Code',Consolas,'Courier New',monospace}
.w1{animation:wv 14s linear infinite}
.w2{animation:wv 22s linear infinite reverse}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(-1000px)}}
.pulse{animation:p 3s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.75}50%{opacity:1}}
.star{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:.9}}
</style>
<rect width="1000" height="150" fill="url(#bg)"/>
<circle class="star" cx="120" cy="30" r="1.5" fill="#fff"/><circle class="star" cx="300" cy="55" r="1" fill="#fff" style="animation-delay:1s"/>
<circle class="star" cx="620" cy="25" r="1.4" fill="#fff" style="animation-delay:2s"/><circle class="star" cx="880" cy="45" r="1.2" fill="#fff" style="animation-delay:.5s"/>
<circle class="star" cx="470" cy="18" r="1" fill="#fff" style="animation-delay:1.6s"/>
<text x="500" y="62" text-anchor="middle" class="sans pulse" font-size="30" font-weight="800" letter-spacing="3" fill="url(#t)">THANKS FOR VISITING</text>
<text x="500" y="88" text-anchor="middle" class="mono" font-size="14" fill="#8b949e">Let's build something great together</text>
<g class="w2"><path d="M0 112 q250.0 -18 500 0 t500 0 t500 0 t500 0 t500 0 L2500 150 L0 150 Z" fill="url(#w2)"/></g>
<g class="w1"><path d="M0 126 q125.0 -12 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 L2500 150 L0 150 Z" fill="url(#w1)"/></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>